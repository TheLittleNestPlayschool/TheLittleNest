<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Little Nest Playschool - Dashboard</title>
    
    <!-- Global Stylesheets with Dynamic Cache-Busting -->
    <link rel="stylesheet" href="background.css">
    <link rel="stylesheet" href="animations.css">
    <link rel="stylesheet" href="path.css">
    <link rel="stylesheet" href="characters.css">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="bottom-nav.css">
</head>
<body>
    <!-- Background Elements -->
    <div class="app-background">
      <div class="cloud-blob top-left"></div>
      <div class="cloud-blob top-right"></div>
      <div class="gradient-overlay"></div>
    </div>

    <!-- Top Header Container -->
    <div id="header-container"></div>

    <!-- Main Viewport Container (Dynamically swaps active views) -->
    <div id="main-viewport"></div>

    <!-- Bottom Navigation Layer -->
    <div id="bottom-nav-container"></div>

    <!-- Path Script Included Globally for Dynamic Injection -->
    <script src="path.js" defer></script>
    
    <script>
        // Simple fetch loader with cache-busting to inject component placeholders instantly
        async function loadComponent(file, containerId) {
            try {
                const response = await fetch(`${file}?v=${Date.now()}`);
                if (response.ok) {
                    const html = await response.text();
                    const container = document.getElementById(containerId);
                    if (container) container.innerHTML = html;
                }
            } catch (error) {
                console.error(`Error loading ${file}:`, error);
            }
        }

        // Global function to swap views dynamically inside the main viewport
        async function switchView(viewFile) {
            await loadComponent(viewFile, 'main-viewport');
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await loadComponent('header.html', 'header-container');
            await loadComponent('bottom-nav.html', 'bottom-nav-container');
            
            // Default view on login: Load the Learning Path into the viewport
            await switchView('learning-path.html');
        });
    </script>
</body>
</html>
