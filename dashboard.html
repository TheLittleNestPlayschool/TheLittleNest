<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Little Nest Playschool - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="background.css">
    <link rel="stylesheet" href="animations.css">
    <link rel="stylesheet" href="path.css">
    <script>
        document.querySelectorAll('link[rel="stylesheet"]').forEach(l => l.href += '?v=' + Date.now());
    </script>
</head>
<body>
    <!-- Background Elements -->
    <div class="app-background">
      <div class="cloud-blob top-left"></div>
      <div class="cloud-blob top-right"></div>
      <div class="gradient-overlay"></div>
    </div>

    <!-- Modular Sections -->
    <div id="header-container"></div>
    <div id="story-reel-container"></div>
    <div id="learning-path-container"></div>
    <div id="bottom-nav-container"></div>

    <!-- Pop-up Modals (Triggered via Bottom Nav) -->
    <div id="mydata-modal" class="modal"></div>
    <div id="mygallery-modal" class="modal"></div>
    <div id="messageus-modal" class="modal"></div>
    <div id="mybadges-modal" class="modal"></div>

    <!-- Path Script Included Globally for Dynamic Injection -->
    <script src="path.js" defer></script>

    <script>
        // Simple fetch loader to inject the modular component placeholders
        async function loadComponent(file, containerId) {
            try {
                const response = await fetch(file);
                if (response.ok) {
                    const html = await response.text();
                    document.getElementById(containerId).innerHTML = html;
                }
            } catch (error) {
                console.error(`Error loading ${file}:`, error);
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await loadComponent('header.html', 'header-container');
            await loadComponent('story-reel.html', 'story-reel-container');
            await loadComponent('learning-path.html', 'learning-path-container');
            await loadComponent('bottom-nav.html', 'bottom-nav-container');
            
            await loadComponent('mydata.html', 'mydata-modal');
            await loadComponent('mygallery.html', 'mygallery-modal');
            await loadComponent('messageus.html', 'messageus-modal');
            await loadComponent('mybadges.html', 'mybadges-modal');
        });
    </script>
</body>
</html>
