<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TLNP</title>
    <!-- Universal background first -->
    <link rel="stylesheet" href="background.css">
    <!-- Page-specific stairs overlay and styles second -->
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="assets/characters/characters.css">
</head>
<body>

    <!-- Background Elements with loginstairs.png layered on top -->
    <div class="app-background">
        <div class="gradient-overlay"></div>
        <div class="login-stairs-bg"></div>
    </div>

    <!-- 3 SEPARATE TEXT NODES -->
    <div class="login-text-layer">
        <div id="text-slot-1" class="text-slot"><div class="login-text-node">The Little Nest Playschool</div></div>
        <div id="text-slot-2" class="text-slot"><div class="login-text-node">Where Little Success Stories Begin</div></div>
        <div id="text-slot-3" class="text-slot"><div class="login-text-node">Grow</div></div>
    </div>

    <!-- 9 SEPARATE CHARACTER / ANIMATION SLOTS -->
    <div class="login-nodes-layer">
        <div id="slot-1" class="login-slot"><div class="login-node">1</div></div>
        <div id="slot-2" class="login-slot"><div class="login-node">2</div></div>
        <div id="slot-3" class="login-slot"><div class="login-node">3</div></div>
        <div id="slot-4" class="login-slot"><div class="login-node">4</div></div>
        <div id="slot-5" class="login-slot"><div class="login-node">5</div></div>
        <div id="slot-6" class="login-slot"><div class="login-node">6</div></div>
        
        <div id="slot-7" class="login-slot">
            <div class="character">
                <object
                id="bird7"
                type="image/svg+xml"
                data="babybird.svg">
                </object>
            </div>
        </div>        
        <div id="slot-8" class="login-slot"><div class="login-node">8</div></div>
        <div id="slot-9" class="login-slot"><div class="login-node">9</div></div>
    </div>

    <!-- Login Container -->
    <div class="login-container">
        <div class="login-card">
            <h2 class="form-section-title">Login</h2>
            
            <div class="login-input-group">
                <input type="email" id="email" class="login-input" placeholder="Email">
                <input type="password" id="password" class="login-input" placeholder="Password">
            </div>
            
            <div class="login-action-row">
                <span class="sign-in-text">Sign in</span>
                <button type="button" onclick="handleLogin()" class="btn-submit">→</button>
            </div>

            <div id="errorMessage" style="color: red; margin-top: 10px; font-size: 0.8rem;"></div>
        </div>
    </div>

    <script>
        localStorage.clear();
        sessionStorage.clear();
        
        if ('caches' in window) {
            caches.keys().then((names) => {
                names.forEach((name) => {
                    caches.delete(name);
                });
            });
        }

        const XANO_BASE_URL = 'https://x8ki-letl-twmt.n7.xano.io/api:wtEDiEuV';

        async function handleLogin() {
            const emailInput = document.getElementById('email').value.trim();
            const passwordInput = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            
            errorDiv.textContent = '';

            if (!emailInput || !passwordInput) {
                errorDiv.textContent = 'Please fill out all fields.';
                return;
            }

            try {
                const response = await fetch(`${XANO_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailInput, password: passwordInput })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.message || 'Invalid credentials.');

                const franchiseId = data.franchise_id || data.user?.franchise_id;
                
                localStorage.setItem('authToken', data.authToken);
                localStorage.setItem('userId', data.user);
                localStorage.setItem('admin_type_id', data.admin_type_id);
                localStorage.setItem('teacher_id', data.teacher_id || data.user?.teacher_id || '');
                localStorage.setItem('franchise_id', franchiseId);
                localStorage.setItem('franchise_name', data.franchise_name || data.user?.franchise_name || '');

                window.location.href = 'dashboard.html';

            } catch (error) {
                errorDiv.textContent = error.message;
            }
        }
    </script>

    <script src="assets/characters/characters.js"></script>
    
</body>
</html>
