<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>The Little Nest Playschool</title>

    <!-- Existing global styles -->
    <link rel="stylesheet" href="background.css">
    <link rel="stylesheet" href="animations.css">
    <link rel="stylesheet" href="path.css">
    <link rel="stylesheet" href="characters.css">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="bottom-nav.css">
    <link rel="stylesheet" href="viewport.css">

    <style>
        /*
         * Temporary Living Stage shell styles.
         *
         * These allow us to establish the experience flow before designing
         * the final stage and scenes. They can later move into livingstage.css.
         */

        .living-stage {
            position: relative;
            width: 100%;
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px 120px;
            box-sizing: border-box;
        }

        .living-stage-scene {
            width: min(100%, 720px);
            text-align: center;
        }

        .living-stage-eyebrow {
            margin: 0 0 10px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0.7;
        }

        .living-stage-title {
            margin: 0;
            font-size: clamp(2rem, 7vw, 4rem);
            line-height: 1.08;
        }

        .living-stage-message {
            max-width: 560px;
            margin: 18px auto 0;
            font-size: clamp(1rem, 3vw, 1.25rem);
            line-height: 1.6;
        }

        .living-stage-actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 28px;
        }

        .living-stage-button {
            min-height: 46px;
            padding: 11px 20px;
            border: 0;
            border-radius: 999px;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .living-stage-button-primary {
            background: #23557f;
            color: white;
        }

        .living-stage-button-secondary {
            background: rgba(255, 255, 255, 0.78);
            color: #23557f;
            border: 1px solid rgba(35, 85, 127, 0.25);
        }

        .living-stage-status {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            padding: 32px;
            text-align: center;
        }

        .living-stage-status[hidden] {
            display: none;
        }

        .living-stage-loader {
            width: 34px;
            height: 34px;
            margin: 0 auto 18px;
            border: 4px solid rgba(35, 85, 127, 0.2);
            border-top-color: #23557f;
            border-radius: 50%;
            animation: living-stage-spin 0.8s linear infinite;
        }

        @keyframes living-stage-spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <!-- Background Elements -->
    <div class="app-background" aria-hidden="true">
        <div class="cloud-blob top-left"></div>
        <div class="cloud-blob top-right"></div>
        <div class="gradient-overlay"></div>
    </div>

    <!-- Existing Header -->
    <header id="header-container"></header>

    <!--
        The Main Stage

        This viewport no longer begins with a static default module.
        The Living Stage first presents the most meaningful opening
        experience available for this family.
    -->
    <main id="main-viewport" aria-live="polite">
        <div
            id="livingStageLoading"
            class="living-stage-status"
        >
            <div>
                <div
                    class="living-stage-loader"
                    aria-hidden="true"
                ></div>

                <p id="livingStageLoadingText">
                    Preparing The Little Nest...
                </p>
            </div>
        </div>
    </main>

    <!-- Existing Bottom Navigation -->
    <nav id="bottom-nav-container"></nav>

    <!-- Existing scripts required by injected components -->
    <script src="path.js" defer></script>

    <script>
        const LOGIN_PAGE = 'login.html';

        /*
         * We are not calling the full Xano startup API yet because its
         * endpoint and response structure have not been defined.
         *
         * This page is ready to receive that context later through:
         *
         *     window.presentLivingStage(context)
         *
         * The context can then be returned from one protected Xano endpoint.
         */

        const livingStageState = {
            context: null,
            openingExperience: null,
            initialized: false
        };

        /*
         * Experience types currently supported by the decision structure.
         *
         * These are not final visual designs. They establish the basic
         * Living Stage flow.
         */
        const EXPERIENCE_TYPES = Object.freeze({
            CELEBRATION: 'celebration',
            TODAYS_CHAPTER: 'todays-chapter',
            CLASS_LATER: 'class-later',
            MISSED_CLASS: 'missed-class',
            STORY_REEL: 'story-reel',
            MEMORY: 'memory',
            NEXT_ADVENTURE: 'next-adventure',
            WELCOME: 'welcome'
        });

        window.addEventListener('DOMContentLoaded', initializeLivingStage);

        async function initializeLivingStage() {
            if (!hasAuthenticatedSession()) {
                redirectToLogin();
                return;
            }

            try {
                await Promise.all([
                    loadComponent('header.html', 'header-container'),
                    loadComponent('bottom-nav.html', 'bottom-nav-container')
                ]);

                /*
                 * Temporary context built from the authenticated session.
                 *
                 * Later this will be replaced by one protected Xano startup
                 * request returning the parent, child, schedule, attendance,
                 * experiences, memories, media, progress, and viewing history.
                 */
                const initialContext = createInitialContext();

                presentLivingStage(initialContext);

                livingStageState.initialized = true;

            } catch (error) {
                console.error(
                    'Unable to initialize the Living Stage:',
                    error
                );

                renderStageError(
                    'We could not prepare The Little Nest right now. Please try again.'
                );
            }
        }

        function hasAuthenticatedSession() {
            return Boolean(localStorage.getItem('authToken'));
        }

        function redirectToLogin() {
            window.location.replace(LOGIN_PAGE);
        }

        function createInitialContext() {
            return {
                parent: {
                    id: localStorage.getItem('parent_id') || '',
                    userId: localStorage.getItem('userId') || '',
                    name: ''
                },

                child: {
                    id: '',
                    name: ''
                },

                franchise: {
                    id: localStorage.getItem('franchise_id') || '',
                    name: localStorage.getItem('franchise_name') || ''
                },

                /*
                 * These values will be filled by Xano.
                 */
                experiences: {
                    unseenCelebration: null,
                    unseenTodaysChapter: null,
                    unseenStoryReel: null,
                    meaningfulMemory: null
                },

                schedule: {
                    hasClassLaterToday: false,
                    missedClassToday: false,
                    nextClass: null,
                    nextAdventure: null
                },

                parentHistory: {
                    lastLoginAt: null,
                    lastExperienceViewed: null,
                    replayCount: 0
                }
            };
        }

        /*
         * This will become the entry point after Xano returns the complete
         * parent context.
         *
         * Example:
         *
         * const context = await loadParentExperienceContext();
         * window.presentLivingStage(context);
         */
        function presentLivingStage(context) {
            livingStageState.context = normalizeContext(context);

            const experience = determineOpeningExperience(
                livingStageState.context
            );

            livingStageState.openingExperience = experience;

            renderOpeningExperience(
                experience,
                livingStageState.context
            );
        }

        window.presentLivingStage = presentLivingStage;

        function normalizeContext(context = {}) {
            return {
                parent: context.parent || {},
                child: context.child || {},
                franchise: context.franchise || {},

                experiences: {
                    unseenCelebration:
                        context.experiences?.unseenCelebration || null,

                    unseenTodaysChapter:
                        context.experiences?.unseenTodaysChapter || null,

                    unseenStoryReel:
                        context.experiences?.unseenStoryReel || null,

                    meaningfulMemory:
                        context.experiences?.meaningfulMemory || null
                },

                schedule: {
                    hasClassLaterToday:
                        Boolean(
                            context.schedule?.hasClassLaterToday
                        ),

                    missedClassToday:
                        Boolean(
                            context.schedule?.missedClassToday
                        ),

                    nextClass:
                        context.schedule?.nextClass || null,

                    nextAdventure:
                        context.schedule?.nextAdventure || null
                },

                parentHistory: context.parentHistory || {}
            };
        }

        /*
         * Version 1 decision hierarchy.
         *
         * This is intentionally deterministic. AI may later assist when
         * several equally meaningful experiences are available, but clear
         * business rules should always handle obvious priorities.
         */
        function determineOpeningExperience(context) {
            const experiences = context.experiences;
            const schedule = context.schedule;

            if (experiences.unseenCelebration) {
                return {
                    type: EXPERIENCE_TYPES.CELEBRATION,
                    data: experiences.unseenCelebration
                };
            }

            if (experiences.unseenTodaysChapter) {
                return {
                    type: EXPERIENCE_TYPES.TODAYS_CHAPTER,
                    data: experiences.unseenTodaysChapter
                };
            }

            if (schedule.hasClassLaterToday) {
                return {
                    type: EXPERIENCE_TYPES.CLASS_LATER,
                    data: schedule.nextClass
                };
            }

            if (schedule.missedClassToday) {
                return {
                    type: EXPERIENCE_TYPES.MISSED_CLASS,
                    data: schedule.nextClass
                };
            }

            if (experiences.unseenStoryReel) {
                return {
                    type: EXPERIENCE_TYPES.STORY_REEL,
                    data: experiences.unseenStoryReel
                };
            }

            if (experiences.meaningfulMemory) {
                return {
                    type: EXPERIENCE_TYPES.MEMORY,
                    data: experiences.meaningfulMemory
                };
            }

            if (schedule.nextAdventure) {
                return {
                    type: EXPERIENCE_TYPES.NEXT_ADVENTURE,
                    data: schedule.nextAdventure
                };
            }

            return {
                type: EXPERIENCE_TYPES.WELCOME,
                data: null
            };
        }

        function renderOpeningExperience(experience, context) {
            const viewport = document.getElementById('main-viewport');

            if (!viewport) {
                return;
            }

            const childName =
                context.child?.name?.trim() || 'your little one';

            const scene = getSceneContent(
                experience,
                childName
            );

            viewport.innerHTML = `
                <section
                    class="living-stage"
                    data-experience-type="${escapeHtml(experience.type)}"
                >
                    <div class="living-stage-scene">
                        <p class="living-stage-eyebrow">
                            ${escapeHtml(scene.eyebrow)}
                        </p>

                        <h1 class="living-stage-title">
                            ${escapeHtml(scene.title)}
                        </h1>

                        <p class="living-stage-message">
                            ${escapeHtml(scene.message)}
                        </p>

                        <div class="living-stage-actions">
                            ${renderSceneActions(scene.actions)}
                        </div>
                    </div>
                </section>
            `;

            bindStageActions();
        }

        function getSceneContent(experience, childName) {
            switch (experience.type) {
                case EXPERIENCE_TYPES.CELEBRATION:
                    return {
                        eyebrow: 'A Little Nest Celebration',
                        title: `${childName} has something wonderful to celebrate.`,
                        message:
                            'Tita Mayumi and Pico have prepared a special moment for your family.',
                        actions: [
                            {
                                label: 'Begin the celebration',
                                action: 'open-celebration',
                                primary: true
                            },
                            {
                                label: 'Explore memories',
                                action: 'open-memories'
                            }
                        ]
                    };

                case EXPERIENCE_TYPES.TODAYS_CHAPTER:
                    return {
                        eyebrow: "Today's Chapter",
                        title: `Let us tell you about ${childName}'s day.`,
                        message:
                            'A new chapter is waiting, filled with moments from today.',
                        actions: [
                            {
                                label: "Open today's chapter",
                                action: 'open-todays-chapter',
                                primary: true
                            },
                            {
                                label: 'Look back together',
                                action: 'open-memories'
                            }
                        ]
                    };

                case EXPERIENCE_TYPES.CLASS_LATER:
                    return {
                        eyebrow: "Today's Adventure",
                        title: `${childName}'s next adventure begins later today.`,
                        message:
                            'Pico is already wondering what everyone will discover.',
                        actions: [
                            {
                                label: 'See what is coming',
                                action: 'open-next-adventure',
                                primary: true
                            },
                            {
                                label: 'Visit Memory Nest',
                                action: 'open-memories'
                            }
                        ]
                    };

                case EXPERIENCE_TYPES.MISSED_CLASS:
                    return {
                        eyebrow: 'The Journey Continues',
                        title: `We missed ${childName} today.`,
                        message:
                            'The next adventure will be waiting whenever your family is ready.',
                        actions: [
                            {
                                label: 'See the next adventure',
                                action: 'open-next-adventure',
                                primary: true
                            },
                            {
                                label: 'Relive a memory',
                                action: 'open-memories'
                            }
                        ]
                    };

                case EXPERIENCE_TYPES.STORY_REEL:
                    return {
                        eyebrow: 'A Story Is Waiting',
                        title: `${childName}'s newest Story Reel is ready.`,
                        message:
                            'Step into the classroom and experience the story together.',
                        actions: [
                            {
                                label: 'Watch Story Reel',
                                action: 'open-story-reel',
                                primary: true
                            },
                            {
                                label: 'Save it for later',
                                action: 'save-for-later'
                            }
                        ]
                    };

                case EXPERIENCE_TYPES.MEMORY:
                    return {
                        eyebrow: 'Memory Nest',
                        title: 'Remember this?',
                        message:
                            `A moment from ${childName}'s story is waiting to be experienced again.`,
                        actions: [
                            {
                                label: 'Relive the memory',
                                action: 'open-memory',
                                primary: true
                            },
                            {
                                label: 'See more memories',
                                action: 'open-memories'
                            }
                        ]
                    };

                case EXPERIENCE_TYPES.NEXT_ADVENTURE:
                    return {
                        eyebrow: 'Coming Next',
                        title: `Another adventure is waiting for ${childName}.`,
                        message:
                            'Take a little look at what Tita Mayumi and Pico have planned next.',
                        actions: [
                            {
                                label: 'See what is next',
                                action: 'open-next-adventure',
                                primary: true
                            },
                            {
                                label: 'Explore the journey',
                                action: 'open-learning-path'
                            }
                        ]
                    };

                case EXPERIENCE_TYPES.WELCOME:
                default:
                    return {
                        eyebrow: 'Welcome Back',
                        title: 'The Little Nest is ready.',
                        message:
                            `Whenever you are ready, let us continue ${childName}'s story together.`,
                        actions: [
                            {
                                label: 'Explore the learning journey',
                                action: 'open-learning-path',
                                primary: true
                            },
                            {
                                label: 'Visit Memory Nest',
                                action: 'open-memories'
                            }
                        ]
                    };
            }
        }

        function renderSceneActions(actions = []) {
            return actions.map((action) => {
                const buttonClass = action.primary
                    ? 'living-stage-button living-stage-button-primary'
                    : 'living-stage-button living-stage-button-secondary';

                return `
                    <button
                        type="button"
                        class="${buttonClass}"
                        data-stage-action="${escapeHtml(action.action)}"
                    >
                        ${escapeHtml(action.label)}
                    </button>
                `;
            }).join('');
        }

        function bindStageActions() {
            const actionButtons = document.querySelectorAll(
                '[data-stage-action]'
            );

            actionButtons.forEach((button) => {
                button.addEventListener('click', () => {
                    handleStageAction(
                        button.dataset.stageAction
                    );
                });
            });
        }

        async function handleStageAction(action) {
            switch (action) {
                case 'open-learning-path':
                    await switchView('learning-path.html');
                    break;

                case 'open-todays-chapter':
                    renderFutureScene(
                        "Today's Chapter",
                        'This scene will be connected to the completed class experience.'
                    );
                    break;

                case 'open-celebration':
                    renderFutureScene(
                        'Celebration',
                        'This scene will replay the complete animated family celebration.'
                    );
                    break;

                case 'open-story-reel':
                    renderFutureScene(
                        'Story Reel',
                        'This scene will present the completed Story Reel.'
                    );
                    break;

                case 'open-memory':
                case 'open-memories':
                    renderFutureScene(
                        'Memory Nest',
                        'This scene will allow the family to relive meaningful moments together.'
                    );
                    break;

                case 'open-next-adventure':
                    renderFutureScene(
                        "What's Coming Next",
                        'This scene will build anticipation for the next session.'
                    );
                    break;

                case 'save-for-later':
                    renderFutureScene(
                        'Saved for Later',
                        'This experience will remain ready for the family to enjoy together.'
                    );
                    break;

                default:
                    console.warn(
                        'Unknown Living Stage action:',
                        action
                    );
            }
        }

        function renderFutureScene(title, message) {
            const viewport = document.getElementById('main-viewport');

            if (!viewport) {
                return;
            }

            viewport.innerHTML = `
                <section class="living-stage">
                    <div class="living-stage-scene">
                        <p class="living-stage-eyebrow">
                            The Living Stage
                        </p>

                        <h1 class="living-stage-title">
                            ${escapeHtml(title)}
                        </h1>

                        <p class="living-stage-message">
                            ${escapeHtml(message)}
                        </p>

                        <div class="living-stage-actions">
                            <button
                                type="button"
                                class="living-stage-button living-stage-button-primary"
                                id="returnToOpeningExperience"
                            >
                                Return to the opening experience
                            </button>
                        </div>
                    </div>
                </section>
            `;

            document
                .getElementById('returnToOpeningExperience')
                ?.addEventListener('click', () => {
                    renderOpeningExperience(
                        livingStageState.openingExperience,
                        livingStageState.context
                    );
                });
        }

        /*
         * Existing component loader retained for the Learning Path,
         * header, bottom navigation, and future standalone components.
         */
        async function loadComponent(file, containerId) {
            const response = await fetch(file, {
                cache: 'no-store'
            });

            if (!response.ok) {
                throw new Error(
                    `Unable to load ${file}.`
                );
            }

            const html = await response.text();
            const container = document.getElementById(containerId);

            if (container) {
                container.innerHTML = html;
            }
        }

        /*
         * Retained for existing navigation compatibility.
         *
         * Later, navigation items may call scene names rather than loading
         * separate HTML files. For now, existing modules still work.
         */
        async function switchView(viewFile) {
            try {
                await loadComponent(
                    viewFile,
                    'main-viewport'
                );
            } catch (error) {
                console.error(
                    `Unable to switch to ${viewFile}:`,
                    error
                );

                renderStageError(
                    'That part of The Little Nest could not be opened.'
                );
            }
        }

        window.switchView = switchView;

        function renderStageError(message) {
            const viewport = document.getElementById('main-viewport');

            if (!viewport) {
                return;
            }

            viewport.innerHTML = `
                <div class="living-stage-status" role="alert">
                    <div>
                        <h1>Something went wrong.</h1>

                        <p>${escapeHtml(message)}</p>

                        <button
                            type="button"
                            class="living-stage-button living-stage-button-primary"
                            id="retryLivingStage"
                        >
                            Try again
                        </button>
                    </div>
                </div>
            `;

            document
                .getElementById('retryLivingStage')
                ?.addEventListener('click', () => {
                    window.location.reload();
                });
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }
    </script>
</body>
</html>
