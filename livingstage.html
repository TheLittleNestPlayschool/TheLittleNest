<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>The Little Nest Playschool</title>

    <!-- Existing global styles -->
    <link rel="stylesheet" href="background.css">
    <link rel="stylesheet" href="path.css">
    <link rel="stylesheet" href="characters.css">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="bottom-nav.css">
    <link rel="stylesheet" href="viewport.css">
    <link rel="stylesheet" href="livingstage.css">
</head>

<body>

    <!-- Background Elements -->
    <div class="app-background" aria-hidden="true">
        <div class="cloud-blob top-left"></div>
        <div class="cloud-blob top-right"></div>
        <div class="gradient-overlay"></div>
    </div>

    <!-- Existing Header -->
    <header id="header-container"></header>

    <!--
        The Main Stage

        This viewport no longer begins with a static default module.
        The Living Stage first presents the most meaningful opening
        experience available for this family.
    -->
    <main id="main-viewport" aria-live="polite">
        <div
            id="livingStageLoading"
            class="living-stage-status"
        >
            <div>
                <div
                    class="living-stage-loader"
                    aria-hidden="true"
                ></div>

                <p id="livingStageLoadingText">
                    Preparing The Little Nest...
                </p>
            </div>
        </div>
    </main>

    <!-- Existing Bottom Navigation -->
    <nav id="bottom-nav-container"></nav>
    <!-- Existing scripts required by injected components -->
    <script src="path.js" defer></script>

    <!-- Living Stage JavaScript -->
    <script src="livingstageutils.js" defer></script>
    <script src="livingstagestate.js" defer></script>
    <script src="livingstageanimations.js" defer></script>
    <script src="livingstagerender.js" defer></script>
    <script src="livingstageactions.js" defer></script>
    <script src="livingstageload.js" defer></script>
</body>
</html>
