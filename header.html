<!-- header.html -->
<div class="dashboard-header">
    <!-- Left: Student Milestone Badge -->
    <div class="custom-badge-container">
        <div class="badge-bg-wrapper">
            <img src="topbadge.png" alt="Badge Background" class="badge-bg-img">
            <div class="badge-inner-content">
                <span class="badge-number">7</span>
                <span class="badge-label">Hours</span>
            </div>
        </div>
        <div class="external-text-group">
            <span class="student-name">Elleisha Stoyko</span>
            <span class="guardian-name">Dave Stoyko</span>
        </div>
    </div>

    <!-- Center: Curved Title, Momma Bird Logo, and Playschool -->
    <div class="header-logo-container">
        <!-- Curved text over the top -->
        <div class="curved-title-wrap">
            <svg class="curved-svg" viewBox="0 0 180 40">
                <path id="curvePath" d="M 10,35 Q 90,0 170,35" fill="transparent" />
                <text>
                    <textPath href="#curvePath" startOffset="50%" text-anchor="middle">
                        THE LITTLE NEST
                    </textPath>
                </text>
            </svg>
        </div>

        <!-- Momma Bird Graphic -->
        <div class="nest-graphic-wrapper">
            <div class="bird-in-nest-graphic">
                <img src="mommabird.png" alt="Momma Bird in Nest" class="mommabird-img">
                <div class="nest-location">Sto. Tomas</div>
            </div>
        </div>

        <div class="brand-title-bottom">Playschool</div>
    </div>

    <!-- Right: Global Network Hours Badge -->
    <div class="custom-badge-container">
        <div class="badge-bg-wrapper">
            <img src="topbadge.png" alt="Badge Background" class="badge-bg-img">
            <div class="badge-inner-content">
                <span class="badge-number-network">22,513+</span>
            </div>
        </div>
        <div class="external-text-group">
            <span class="network-subtitle">Learning Hours</span>
            <span class="network-subtitle">and Counting!</span>
        </div>
    </div>
</div>
