<style>
    .bottom-nav-section {
        position: sticky;
        bottom: 0;
        left: 0;
        width: 100%;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        border-top: 1px solid rgba(217, 119, 6, 0.2);
        padding: 4px 8px;
        box-sizing: border-box;
        display: flex;
        justify-content: space-around;
        align-items: center;
        z-index: 100;
    }

    .nav-button {
        background: transparent;
        border: none;
        padding: 2px 6px;
        font-size: 0.55rem;
        font-weight: 700;
        color: #475569;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
        transition: color 0.2s ease;
    }

    .nav-button:hover {
        color: #d97706;
    }

    .nav-icon {
        font-size: 0.85rem;
    }
</style>

<div class="bottom-nav-section">
    <button class="nav-button" onclick="openModal('mydata-modal')">
        <span class="nav-icon">📊</span>
        <span>My Data</span>
    </button>
    <button class="nav-button" onclick="openModal('mygallery-modal')">
        <span class="nav-icon">🖼️</span>
        <span>Gallery</span>
    </button>
    <button class="nav-button" onclick="openModal('messageus-modal')">
        <span class="nav-icon">💬</span>
        <span>Message</span>
    </button>
    <button class="nav-button" onclick="openModal('mybadges-modal')">
        <span class="nav-icon">🏆</span>
        <span>Badges</span>
    </button>
</div>

<script>
    function openModal(modalId) {
        const modal = document.getElementById(modalId);
        if (modal) {
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }
    }
</script>
