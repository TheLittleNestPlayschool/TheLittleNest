<!-- learning-path.html -->
<link rel="stylesheet" href="path.css">

<div class="learning-path-section">
    <div class="learning-path-title"></div>

    <div class="path-visual-wrapper">
        <!-- The stairs image asset -->
        <img src="stair.png" alt="Learning Path Stairs" class="path-background-image">
        
        <!-- Overlay container holding both the milestone node slots and text slots -->
        <div class="milestone-bubbles-container" id="stone-path-container">
            <!-- Milestone Slots 1-9 -->
            <div class="milestone-slot" id="slot-1"></div>
            <div class="milestone-slot" id="slot-2"></div>
            <div class="milestone-slot" id="slot-3"></div>
            <div class="milestone-slot" id="slot-4"></div>
            <div class="milestone-slot" id="slot-5"></div>
            <div class="milestone-slot" id="slot-6"></div>
            <div class="milestone-slot" id="slot-7"></div>
            <div class="milestone-slot" id="slot-8"></div>
            <div class="milestone-slot" id="slot-9"></div>

            <!-- Text Label Slots 1-9 -->
            <div class="text-slot" id="text-slot-1"></div>
            <div class="text-slot" id="text-slot-2"></div>
            <div class="text-slot" id="text-slot-3"></div>
            <div class="text-slot" id="text-slot-4"></div>
            <div class="text-slot" id="text-slot-5"></div>
            <div class="text-slot" id="text-slot-6"></div>
            <div class="text-slot" id="text-slot-7"></div>
            <div class="text-slot" id="text-slot-8"></div>
            <div class="text-slot" id="text-slot-9"></div>
        </div>
    </div>
</div>
