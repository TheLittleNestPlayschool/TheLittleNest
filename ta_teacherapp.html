
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Little Nest Playschool — Teacher App</title>
</head>
<body>
    <main>
        <h1>Teacher Experience Builder</h1>
        <p id="teacherStatus">Loading teacher session...</p>
    </main>

    <script>
        const authToken = localStorage.getItem('authToken');
        const teacherId = localStorage.getItem('teacher_id');

        if (!authToken || !teacherId) {
            window.location.replace('loginteacher.html');
        } else {
            document.getElementById('teacherStatus').textContent =
                'Teacher session is active.';
        }
    </script>
</body>
</html>
