<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        TLNP Teachers
    </title>

    <link rel="stylesheet" href="background.css">

    <link rel="stylesheet" href="ta_teacherapp.css">
    <link rel="stylesheet" href="ta_stage.css">
    <link rel="stylesheet" href="ta_teacher_information.css">
    <link rel="stylesheet" href="ta_attendance.css">
</head>

<body>
    <div
        class="app-background"
        aria-hidden="true"
    >
        <div class="cloud-blob top-left"></div>
        <div class="cloud-blob top-right"></div>
        <div class="gradient-overlay"></div>
    </div>

    <main class="teacher-app">
        <p
            id="teacherStatus"
            class="teacher-status"
            aria-live="polite"
        >
            Loading teacher session...
        </p>

        <section
            id="teacherStage"
            class="teacher-stage"
            aria-live="polite"
        ></section>
    </main>

    <script type="module">
        import {
            startTeacherApp
        } from './ta_startup.js';

        startTeacherApp();
    </script>
</body>
</html>
