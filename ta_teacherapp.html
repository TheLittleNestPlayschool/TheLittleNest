<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Little Nest Playschool — Teacher App</title>

    <link rel="stylesheet" href="background.css">
    <link rel="stylesheet" href="ta_app.css">
</head>

<body>
    <div class="app-background" aria-hidden="true">
        <div class="cloud-blob top-left"></div>
        <div class="cloud-blob top-right"></div>
        <div class="gradient-overlay"></div>
    </div>

    <main class="teacher-app">
        <header class="teacher-app-header">
            <h1 class="teacher-app-title">
                Teacher Experience Builder
            </h1>

            <p
                id="teacherStatus"
                class="teacher-status"
                aria-live="polite"
            >
                Loading teacher session...
            </p>
        </header>

        <section
            id="teacherWorkspace"
            class="teacher-workspace"
            aria-live="polite"
        ></section>
    </main>

    <script type="module">
        import {
            startTeacherApp
        } from './ta_startup.js';

        startTeacherApp();
    </script>
</body>
</html>
